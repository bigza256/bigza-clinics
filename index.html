<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16359B">
<title>BIGZA Clinics</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<style>
  body.splash-body {
    min-height: 100dvh;
    margin: 0;
    background: linear-gradient(160deg, #0B1736 0%, #16359B 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .splash {
    text-align: center;
    max-width: 360px;
    padding: 1.5rem;
  }
  .splash__mark {
    width: 76px;
    height: 76px;
    margin: 0 auto 1.25rem;
    border-radius: 20px;
    background: linear-gradient(135deg, #16359B, #5B3FC7);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: .04em;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  .splash h1 {
    margin: 0;
    font-size: 1.35rem;
    letter-spacing: .06em;
    color: #fff;
  }
  .splash__tag {
    margin: .35rem 0 0;
    color: #B7C2E0;
    font-size: .85rem;
  }
  .splash__status {
    margin-top: 2rem;
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    padding: .55rem 1rem;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    font-size: .82rem;
    color: #D9E1F5;
  }
  .splash__spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash__footer {
    position: fixed;
    bottom: 1rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: .72rem;
    color: rgba(255,255,255,.5);
  }
</style>
</head>
<body class="splash-body">

<div class="splash">
  <div class="splash__mark">BZ</div>
  <h1>BIGZA CLINICS</h1>
  <p class="splash__tag">Your Health Is Our Priority</p>
  <div class="splash__status">
    <span class="splash__spinner"></span>
    <span id="status-text">Checking your session…</span>
  </div>
</div>

<div class="splash__footer">Professional Healthcare. Right at Your Doorstep and Clinic.</div>

<div id="toasts" class="toasts"></div>

<script type="module">
import { auth, db, onAuthStateChanged, doc, getDoc } from './js/firebase.js';

const statusText = document.getElementById('status-text');

/* Safe timeout: if Firebase Auth never responds within 6 seconds
   (offline, blocked, or cold start), send the user to login
   instead of leaving them stuck on a spinner forever. */
const bailout = setTimeout(() => {
  statusText.textContent = 'Redirecting to sign-in…';
  location.replace('login.html');
}, 6000);

onAuthStateChanged(auth, async (user) => {
  clearTimeout(bailout);

  if (!user) {
    statusText.textContent = 'Redirecting to sign-in…';
    location.replace('login.html');
    return;
  }

  /* Signed in — verify the staff profile exists and is active
     before letting the shell load. This prevents a signed-in
     Firebase user with no profile from reaching dashboard.html
     and getting stuck on a permission error. */
  try {
    statusText.textContent = 'Loading your profile…';
    const snap = await getDoc(doc(db, 'users', user.uid));

    if (!snap.exists()) {
      // First-ever sign-in — dashboard.js / auth.js will bootstrap
      // the SUPER_ADMIN profile on their next step.
      statusText.textContent = 'Setting up your account…';
      location.replace('dashboard.html');
      return;
    }

    const profile = snap.data();
    if (profile.active === false) {
      statusText.textContent = 'Account inactive — signing out…';
      await auth.signOut();
      location.replace('login.html');
      return;
    }

    statusText.textContent = 'Welcome back — opening dashboard…';
    location.replace('dashboard.html');
  } catch (err) {
    /* Rules rejected the read or network died. Don't trap the
       user on this screen — send them to login where they can
       retry or contact support. */
    console.error('[index] profile check failed:', err);
    statusText.textContent = 'Redirecting to sign-in…';
    location.replace('login.html');
  }
});
</script>
</body>
</html>
